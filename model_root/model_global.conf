[GlobalControl]
; 全局唯一形变参数 t，取值范围 [0, 1]
; t=0  → 全量原始形态 (4096维, 原始权重 W_0)
; t=1  → 极致骨架压缩 (512维,  紧凑权重 W_1)
; 0<t<1 → 连续过渡态，无硬截断
GlobalT=0.0
OriginDim=4096
CompactDim=512

[GlobalRule]
; 形变公式（全局统一，仅注释用途）
DimFormula=d(t)={OriginDim}*(1-t)+{CompactDim}*t
WeightFormula=W(t)=(1-t)*W0+t*W1

[Topology]
; 拓扑链路语法：serial(组名) 串联 | parallel(组名) 并联
; 组名须与 model_root/ 下子目录名一致
TopologyChain=serial(norm_group) -> parallel(attn_group) -> serial(ffn_group) -> serial(route_group)

[System]
; LazyLoad=1 惰性加载（推荐沙箱/低配环境）
; ThreadNum 并联计算线程数
LazyLoad=1
ThreadNum=4

; ══════════════════════════════════════════════════
; 增量全局多模态配置（原有单模态路径完全兼容，不受影响）
; ══════════════════════════════════════════════════
[MultiModalGlobal]
; 多模态总开关：1=启用  0=禁用（禁用时退化为原有纯向量模式）
ModalEnable=1
; 默认输入/输出模态：text / image / audio
DefaultInputModal=text
DefaultOutputModal=text
; 跨模态路由：1=根据8维指纹自动分发至对应模态分支
CrossModalRoute=1

; 拓扑语法增量说明（原有写法继续有效）：
;   serial(组名|modal:模态名)  — 精准指定分支处理模态
;   parallel(组名1,组名2)      — 多模态并联融合节点
; 示例（多模态融合链路，仅注释，不影响当前运行）：
; TopologyChain_MultiModal=serial(encoder_text|modal:text) -> parallel(modal_fusion_group) -> serial(decoder_text|modal:text)
